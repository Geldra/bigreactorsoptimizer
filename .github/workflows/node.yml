name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [19.x]

    steps:
    - continue-on-error: true
      run: sudo systemctl is-active bigreactorsoptimizer && sudo systemctl stop bigreactorsoptimizer
    - continue-on-error: true
      run: sudo systemctl is-active bigreactorsvisualizer && sudo systemctl stop bigreactorsvisualizer
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: node -v
    - run: npm remove sharp
    - run: npm install sharp
    - run: npm rebuild
    - run: npm install
    - run: sudo systemctl start bigreactorsoptimizer
    - run: sudo systemctl start bigreactorsvisualizer
    - run: npm remove sharp
    - run: npm install sharp
    - run: npm rebuild
    - run: npm install
    - run: sudo systemctl start bigreactorsvisualizer